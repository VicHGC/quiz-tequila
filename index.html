<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find Your Perfect Tequila | Tequila Zarpado</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-blue: #155E6D; 
            --brand-gold: #DFAB36; 
            --brand-dark: #1A1A1A;
            --bg-card: rgba(255, 255, 255, 0.92);
            --radius-md: 16px;
            --radius-lg: 24px;
            --shadow-lg: 0 16px 48px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('agave.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
            color: var(--brand-blue);
            overflow-y: auto; /* Permite scroll en pantallas cortas */
        }

        .container {
            max-width: 540px;
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        .header p {
            color: #f0f0f0;
            font-size: 0.9rem;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            height: 8px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--brand-gold);
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-card, .result-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
        }

        .question-number {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--brand-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: rgba(255, 255, 255, 0.7);
            border: 1.5px solid #e0e0e0;
            border-radius: var(--radius-md);
            padding: 18px 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            color: #333;
            text-align: left;
        }

        .option:hover {
            border-color: var(--brand-gold);
            background: #ffffff;
            transform: translateY(-2px);
        }

        .result-card { text-align: center; }
        .result-badge {
            display: inline-block;
            background: var(--brand-blue);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2.1rem;
            color: var(--brand-gold);
            margin-bottom: 15px;
        }

        .cocktail-image {
            max-width: 220px;
            height: auto;
            margin: 20px auto;
            display: block;
            border-radius: 12px;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }

        .btn-retry {
            background: var(--brand-blue);
            border: none;
            color: #ffffff;
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            margin-top: 20px;
        }

        .footer-branding {
            margin-top: auto;
            padding: 30px 0;
            text-align: center;
        }

        .footer-logo {
            max-width: 180px;
            filter: brightness(0) invert(1);
        }

        .hidden { display: none; }

        /* RESPONSIVE FIXES */
        @media (max-width: 480px) {
            body { padding: 15px; }
            .header h1 { font-size: 1.7rem; }
            .question-card, .result-card { padding: 30px 20px; }
            .question-text { font-size: 1.15rem; }
            .result-title { font-size: 1.8rem; }
            .cocktail-image { max-width: 160px; max-height: 200px; object-fit: contain; }
            .footer-logo { max-width: 140px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tequila Match</h1>
            <p>Discover your perfect pour</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="quizContainer">
            <div class="question-card" id="questionCard">
                <span class="question-number" id="questionNumber"></span>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="options"></div>
            </div>
        </div>

        <div class="result-card hidden" id="resultCard">
            <div class="result-badge">Your Perfect Match</div>
            <h2 class="result-title" id="resultTitle"></h2>
            <p id="resultDescription" style="font-size: 0.95rem; color: #444;"></p>
            
            <div style="border-top: 1px solid #ddd; margin-top: 25px; padding-top: 20px;">
                <p style="font-size: 0.8rem; font-weight: 700; color: var(--brand-blue); text-transform: uppercase;">Recommended Serve</p>
                <img id="cocktailImage" src="" alt="Drink" class="cocktail-image">
                <h3 id="cocktailName" style="color: var(--brand-gold); font-size: 1.4rem; margin-bottom: 10px;"></h3>
                <button class="btn-retry" id="retryBtn">Take Quiz Again</button>
            </div>
        </div>
    </div>

    <footer class="footer-branding">
        <img src="CoronaReal.PNG" alt="Corona Real Logo" class="footer-logo">
    </footer>

    <script>
        const questions = [
            {
                question: "Which flavor profile appeals to you the most?",
                options: [
                    { text: "Bright, crisp, and refreshing", type: "blanco" },
                    { text: "Smooth, balanced, and lightly warm", type: "reposado" },
                    { text: "Rich, round, and layered", type: "anejo" },
                    { text: "Deep, bold, and luxurious", type: "extra-anejo" }
                ]
            },
            {
                question: "Which aromas do you enjoy most in a spirit?",
                options: [
                    { text: "Citrus, herbs, and fresh agave", type: "blanco" },
                    { text: "Vanilla, light spice, and soft oak", type: "reposado" },
                    { text: "Caramel, toasted oak, and baking spice", type: "anejo" },
                    { text: "Dark chocolate, dried fruit, oak, and toffee", type: "extra-anejo" }
                ]
            },
            {
                question: "How do you usually enjoy premium spirits?",
                options: [
                    { text: "In fresh, vibrant cocktails", type: "blanco" },
                    { text: "On the rocks or in simple serves", type: "reposado" },
                    { text: "Sipped slowly and enjoyed neat", type: "anejo" },
                    { text: "Neat, in a more elevated and special setting", type: "extra-anejo" }
                ]
            },
            {
                question: "What kind of experience are you looking for?",
                options: [
                    { text: "Energetic and refreshing", type: "blanco" },
                    { text: "Smooth and versatile", type: "reposado" },
                    { text: "Refined and complex", type: "anejo" },
                    { text: "Deep, memorable, and indulgent", type: "extra-anejo" }
                ]
            },
            {
                question: "Which occasion sounds most like you?",
                options: [
                    { text: "A lively brunch, rooftop, or sunny afternoon", type: "blanco" },
                    { text: "A dinner with friends or an easygoing evening", type: "reposado" },
                    { text: "A refined night out or intimate dinner", type: "anejo" },
                    { text: "A celebration, nightcap, or luxury moment", type: "extra-anejo" }
                ]
            },
            {
                question: "Which finish do you prefer?",
                options: [
                    { text: "Clean and crisp", type: "blanco" },
                    { text: "Smooth and mellow", type: "reposado" },
                    { text: "Long and warming", type: "anejo" },
                    { text: "Rich and lingering", type: "extra-anejo" }
                ]
            }
        ];

        const results = {
            blanco: { title: "Tequila Blanco", description: "You appreciate the pure essence of the agave. Fresh, crystal clear, and bursting with citrus energy." },
            reposado: { title: "Tequila Reposado", description: "You seek balance. Smooth transition from fresh agave to gentle notes of vanilla and oak." },
            anejo: { title: "Tequila Añejo", description: "Sophistication is your guide. Rich, dark flavors like caramel and baking spices, refined by time." },
            "extra-anejo": { title: "Tequila Extra Añejo", description: "The pinnacle of luxury. A complex, deep, and slow-sipping experience for the true connoisseur." }
        };

        const cocktails = {
            blanco: [
                { name: "Margarita", img: "margarita.png" },
                { name: "Paloma", img: "paloma.png" },
                { name: "Ranch Water", img: "RanchWater.png" }
            ],
            reposado: [
                { name: "Reposado Paloma", img: "reposadoPaloma.png" },
                { name: "Tequila Sour", img: "tequilasour.png" },
                { name: "Tequila Mule", img: "mule.png" }
            ],
            anejo: [
                { name: "Tequila Old Fashioned", img: "oldFashoned.png" },
                { name: "Añejo Manhattan", img: "Añejo Manhattan-style serve.png" },
                { name: "Neat on a Large Ice Cube", img: "Neatoronalargeicecube.png" }
            ],
            "extra-anejo": [
                { name: "Neat in a Sipping Glass", img: "Neatinasippingglass.png" },
                { name: "Extra Añejo Old Fashioned", img: "ExtraAñejoOldFashioned.png" },
                { name: "Luxury After-Dinner Serve", img: "Luxuryafter-dinnerserve.png" }
            ]
        };

        let currentQuestion = 0;
        let scores = { blanco: 0, reposado: 0, anejo: 0, "extra-anejo": 0 };

        function updateProgress() {
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById('questionText').textContent = q.question;
            const container = document.getElementById('options');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt.text;
                btn.onclick = () => {
                    scores[opt.type]++;
                    currentQuestion++;
                    if (currentQuestion < questions.length) showQuestion(); else showResult();
                };
                container.appendChild(btn);
            });
            updateProgress();
        }

        function showResult() {
            const winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            const res = results[winner];
            const drink = cocktails[winner][Math.floor(Math.random() * cocktails[winner].length)];
            
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
            document.getElementById('resultTitle').textContent = res.title;
            document.getElementById('resultDescription').textContent = res.description;
            document.getElementById('cocktailName').textContent = drink.name;
            document.getElementById('cocktailImage').src = drink.img;
            window.scrollTo(0, 0); // Sube al inicio para ver el resultado
        }

        document.getElementById('retryBtn').onclick = () => {
            currentQuestion = 0;
            scores = { blanco: 0, reposado: 0, anejo: 0, "extra-anejo": 0 };
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('quizContainer').classList.remove('hidden');
            showQuestion();
        };

        showQuestion();
    </script>
</body>
</html>
